# Geobot — orquestación completa. El punto de entrada para operar es el
# Makefile (make scrape | kb | up | down | logs); ver README.md.
#
#   frontend   nginx con los estáticos de Next + proxy de /api al backend.
#              Es el ÚNICO servicio con puerto publicado.
#   backend    API Express del chat. Solo lee: la colección publicada de Qdrant
#              (alias kb_chunks) y, de PostgreSQL, la vista de códigos publicados.
#   kb-worker  Sincroniza la base de conocimiento (bloque 1): consume los informes
#              de corrida del scraper, convierte/OCR, mantiene la matriz en
#              PostgreSQL e indexa en Qdrant. Único escritor de ambos.
#   postgres   Matriz documental, versiones, registros y notificaciones (esquema kb).
#   qdrant     Índice vectorial denso + BM25 disperso, servido por alias.
#   scraper    (profile "setup") adquisición y verificación de fuentes.
#
# Volúmenes de datos:
#   geobot-data    corpus adquirido (área de adquisición, NO es la base)
#   geobot-runs    informes de corrida: escritura para scraper y kb-worker
#   geobot-pg      PostgreSQL          geobot-qdrant  Qdrant
#   geobot-cache   modelos ONNX y caché diagnóstica de documentos
#   geobot-var     registro de interacciones y exportaciones
#
# Toda la configuración se lee de .env (plantilla: .env.example). Lo único que
# se fija aquí son las rutas, los hosts internos y el puerto DENTRO del
# contenedor, que dependen de este archivo y no deben cambiarse desde .env.
# PostgreSQL y Qdrant NO publican puertos: solo son alcanzables en la red
# interna de Compose (principio VII de la constitución).

name: geobot

x-backend-paths: &backend-paths
  PORT: "4000"
  GEOTRENDS_DOCUMENTS_ROOT: /app/data
  RETRIEVAL_CACHE_DIR: /app/.cache/retrieval
  DOCUMENT_CACHE_DIR: /app/.cache/documents
  CHAT_LOG_FILE: /app/var/chat-interactions.csv
  QDRANT_URL: http://qdrant:6333
  # SPEC007: cargas manuales del panel (backend las recibe, kb-worker las convierte) en el volumen
  # compartido `geobot-var`; nada de ello es público. La lista de enlaces del scraper la publica el
  # kb-worker en el volumen de informes (`geobot-runs`, subcarpeta `config/`).
  KB_UPLOAD_DIR: /app/var/cargas

services:
  backend:
    build: ./backend
    image: geobot-backend:latest
    env_file: .env
    environment:
      <<: *backend-paths
      # Rol de solo lectura: el chat nunca escribe en la matriz (R13).
      APP_DATABASE_URL: postgres://app_reader:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-geobot}
      # Una capa de proxy (el nginx del frontend). Súbelo si hay otro balanceador delante.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Roles limitados del bloque 2; los crea y migra el servicio chat-migrate.
      CHAT_DATABASE_URL: postgres://chat_app:${CHAT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-geobot}
      ADMIN_DATABASE_URL: postgres://admin_app:${ADMIN_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-geobot}
    volumes:
      - geobot-cache:/app/.cache
      - geobot-var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      chat-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Healthcheck definido en backend/Dockerfile (GET /health).

  # Crea roles y aplica las migraciones de chat/admin (idempotente, también sobre
  # un volumen existente). Corre con la cuenta administradora, nunca con los roles
  # del runtime, y termina. Las contraseñas llegan por entorno, no por argumentos.
  chat-migrate:
    image: geobot-backend:latest
    env_file: .env
    environment:
      CHAT_MIGRATOR_URL: postgres://${POSTGRES_USER:-geobot_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geobot}
    command: ["node", "dist/chat/migrateCli.js"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Purga horaria de retención (RNF-C3-IN-01): 12 meses calendario + hasta 24 h. Idempotente;
  # cada corrida queda en chat.purge_run. Rol chat_maint, sin acceso a la KB ni al panel.
  chat-purge:
    image: geobot-backend:latest
    env_file: .env
    environment:
      MAINT_DATABASE_URL: postgres://chat_maint:${MAINT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-geobot}
    command: ["sh", "-c", "while true; do node dist/chat/purgeCli.js; sleep 3600; done"]
    healthcheck:
      disable: true
    depends_on:
      chat-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_OFFICIAL_CONTACT_URL: ${NEXT_PUBLIC_OFFICIAL_CONTACT_URL:-}
    image: geobot-frontend:latest
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped
    # Healthcheck definido en frontend/Dockerfile.

  kb-worker:
    image: geobot-backend:latest
    env_file: .env
    environment:
      <<: *backend-paths
      KB_DATABASE_URL: postgres://kb_writer:${KB_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-geobot}
      KB_RUNS_DIR: /app/data/runs
      KB_EXPORT_DIR: /app/var/exports
    command: ["node", "dist/kb/worker.js"]
    # Aislamiento del anfitrión (RNF-C3-IN-13). La reindexación completa NO debe degradar al
    # Observatorio/Geoportal ni al chat que comparten la máquina. Los valores por defecto son
    # NEUTROS (sin límite); si N313 falla se ajustan por entorno sin tocar el código ni la cuota
    # del chat: KB_WORKER_CPU_SHARES bajo (p. ej. 256) cede CPU al backend y al anfitrión cuando
    # compiten; KB_WORKER_CPUS/KB_WORKER_MEM_LIMIT fijan un techo. Ver
    # specs/005-integracion-c3-c4/evidencias/aceptacion/recursos.md.
    cpu_shares: ${KB_WORKER_CPU_SHARES:-1024}
    cpus: ${KB_WORKER_CPUS:-0}
    mem_limit: ${KB_WORKER_MEM_LIMIT:-0}
    # El worker no sirve HTTP: se sustituye el HEALTHCHECK heredado de la imagen del
    # backend por el latido que escribe worker.ts (renovado cada 30 s).
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/kb-worker.alive');process.exit(Date.now()-s.mtimeMs<300000?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    volumes:
      # El corpus se lee; solo los informes de corrida se escriben (procesados/rechazados).
      - ${DATA_DIR:-geobot-data}:/app/data:ro
      - geobot-runs:/app/data/runs
      - geobot-cache:/app/.cache
      - geobot-var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      backend:
        condition: service_started   # misma imagen: se construye una sola vez
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geobot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-geobot}
      KB_DB_PASSWORD: ${KB_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - geobot-pg:/var/lib/postgresql/data
      # Crea los roles kb_writer/app_reader y el esquema kb en el primer arranque.
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    # Tag verificado; >= 1.10 por el modifier idf del vector disperso (R3).
    # El cliente @qdrant/js-client-rest va en la misma versión menor.
    image: qdrant/qdrant:v1.19.2-unprivileged
    volumes:
      - geobot-qdrant:/qdrant/storage
    restart: unless-stopped

  scraper:
    build: ./web_scraper
    image: geobot-scraper:latest
    environment:
      # Vacío = todas las fuentes registradas en scraper/sources.py.
      SCRAPER_SOURCES: ${SCRAPER_SOURCES:-}
      # Corrida programada (RF-C3-IV-02): domingo 02:00. Día del mes y mes deben ser '*'.
      SCRAPER_CRON: ${SCRAPER_CRON:-0 2 * * 0}
      TZ: America/Bogota
      KB_UMBRAL_ESTRUCTURA: ${KB_UMBRAL_ESTRUCTURA:-0.3}
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-geobot-data}:/data
      - geobot-runs:/data/runs

volumes:
  geobot-data:
  geobot-runs:
  geobot-cache:
  geobot-var:
  geobot-pg:
  geobot-qdrant:
