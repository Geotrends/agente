# Sirve el export estático de Next y reenvía /api y /health al backend.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # DNS interno de Docker, re-resuelto cada 10 s: si el contenedor del backend
  # se recrea y cambia de IP, nginx lo sigue encontrando sin reiniciarse.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:4000;

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # El backend limita la tasa por IP; con TRUST_PROXY=1 lee esta cabecera.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Una consulta puede agotar el presupuesto de fallback entre proveedores
    # (FALLBACK_BUDGET_MS, 75 s por defecto) más la recuperación.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 128k;
  }

  location = /health {
    proxy_pass $backend;
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
