# Sirve el export estático de Next y reenvía /api y /health al backend.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # DNS interno de Docker, re-resuelto cada 10 s: si el contenedor del backend
  # se recrea y cambia de IP, nginx lo sigue encontrando sin reiniciarse.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:4000;

  # SPEC007 · panel de administración: la carga de documentos (hasta 32 MiB + metadata) y la
  # exportación .xlsx necesitan más cuerpo y más plazo que el chat. El perímetro ciudadano
  # (`/api/chat`, 128 KiB y 40 s) NO cambia: estas rutas exactas solo atienden a sesiones del panel.
  location = /api/admin/documents {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Client-IP "";
    proxy_set_header True-Client-IP "";
    proxy_request_buffering off;
    client_max_body_size 33m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    access_log off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /api/admin/interactions/export {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Client-IP "";
    proxy_set_header True-Client-IP "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    access_log off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # El backend limita la tasa por IP y resuelve la IP del cliente contando saltos confiables
    # (TRUST_PROXY=N): añade la dirección que ve este proxy a la derecha de la cadena y descarta lo
    # que el cliente escribió a la izquierda. Las cabeceras alternativas que un cliente podría usar
    # para suplantar origen o IP se borran antes de llegar al backend.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Client-IP "";
    proxy_set_header True-Client-IP "";
    # El cuerpo se transmite al backend a medida que llega: un cuerpo lento consume el plazo de 40 s
    # que corre desde la recepción de los encabezados, no desde que nginx termina de bufferizarlo
    # (RF-C3-IN-04). Sin esto el reloj del backend arrancaría después de la lectura completa.
    proxy_request_buffering off;
    client_body_timeout 45s;
    # El backend corta cada consulta a los 40 s (plazo único, incluida la cola); el proxy
    # espera algo más para que siempre llegue el JSON de error y no una página HTML.
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    # 128 KiB exactos (131072 bytes), sin límite de caracteres adicional (RNF-C3-IN-06).
    client_max_body_size 128k;
    # Sin registro de acceso en la API: la IP, la ruta y la hora de una consulta anónima no se
    # conservan (RF-C3-IN-07). Los errores del propio nginx siguen en error_log, sin cuerpos.
    access_log off;
    # Ninguna respuesta de la API (éxito, validación, 401/403/413/429 o error del proxy) se
    # almacena en intermediarios (RNF-C3-IN-12). Se oculta la del backend para emitir una sola.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
    # Los errores que genera nginx (backend caído o reiniciándose, timeout, cuerpo excesivo) van
    # en el MISMO formato de catálogo que los del backend, sin texto técnico: una página HTML aquí
    # el navegador no la podía leer. Sin proxy_intercept_errors, los JSON del propio backend
    # (incluidos sus 503) pasan intactos.
    error_page 413 = @api_too_large;
    error_page 502 503 = @api_unavailable;
    error_page 504 = @api_timeout;
  }

  location @api_too_large {
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    return 413 '{"error":{"codigo":"CUERPO_EXCESIVO","mensaje":"La solicitud es demasiado grande."},"canales":[]}';
  }

  location @api_unavailable {
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 30 always;
    return 503 '{"error":{"codigo":"SERVICIO_NO_DISPONIBLE","mensaje":"No pude atender la consulta en este momento. Puede intentarlo de nuevo en unos minutos o usar los canales oficiales."},"canales":[]}';
  }

  location @api_timeout {
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 30 always;
    return 504 '{"error":{"codigo":"SERVICIO_NO_DISPONIBLE","mensaje":"No pude atender la consulta en este momento. Puede intentarlo de nuevo en unos minutos o usar los canales oficiales."},"canales":[]}';
  }

  location = /health {
    proxy_pass $backend;
  }

  # Disponibilidad del chat (índice y proveedores): lo que vigila el monitor
  # externo. /health solo dice que el proceso vive.
  location = /ready {
    proxy_pass $backend;
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;

    try_files $uri =404;
  }

  # Ruta del iframe (SPEC004). Solo el Observatorio oficial puede incrustarla: la CSP con
  # frame-ancestors la genera scripts/build-csp.mjs (hashes de los scripts en línea) y no hay
  # X-Frame-Options en conflicto. Sin fallback: nunca cae en la página heredada.
  location = /chat {
    include /etc/nginx/snippets/csp-chat.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /chat.html =404;
  }

  # Panel de administración (SPEC008, FR-017): nunca incrustable, sin caché y sin cambiar de
  # contexto de ejecución. La CSP con hashes de scripts en línea es la de /chat; aquí se fijan
  # las directivas que no dependen de ellos.
  location ^~ /admin {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri.html $uri/ /index.html;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    try_files $uri $uri.html $uri/ /index.html;
  }
}
