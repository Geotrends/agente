# Integración continua del backend (hallazgos M-12, M-13 y A-10).
#
# No había CI en el repositorio, así que nada impedía que la suite dejara de
# compilar, que una dependencia acumulara vulnerabilidades altas durante un
# año, o que un cambio de recuperación rompiera la calidad sin que nadie lo
# notara hasta que un ciudadano reportara una respuesta mal fundamentada.
name: CI

on:
  # Flujo de ramas de la constitución: develop → prod_test → main.
  # "development" se incluye por si la rama de integración se renombra.
  push:
    branches: [develop, development, prod_test, main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # kb-ocr.test.ts usa el motor real (RF-C3-IV-07): la confianza la reporta
      # Tesseract, no se simula.
      - name: Herramientas de OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa poppler-utils

      - name: Instalar dependencias
        run: npm ci

      # Cubre src/, test/ y scripts/. `tsconfig.json` solo incluye src/ porque
      # su trabajo es emitir dist/, lo que dejaba las pruebas sin revisar.
      - name: Comprobar tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      # Gate del bloque 2 (RNF-C3-DI-03): paridad exacta de IDs del contador TypeScript con el
      # oráculo oficial de tiktoken (fixture versionado; el oráculo en Python NO corre en línea).
      - name: Paridad del tokenizador
        run: npm run eval:tokenizer

      # Bloqueante a propósito: es lo que este paso existe para evitar. Las
      # moderadas no frenan el build, las altas sí.
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

      # SPEC005 (RNF-C3-IN-07/08/10): la política IAM versionada cumple el contrato (una acción, dos ARN
      # exactos, sin comodines), el repositorio y el paquete no traen credenciales y el manifiesto de
      # carga sigue vigente. Imprimen conteos y rutas, nunca valores.
      - name: Contrato IAM, escaneo de credenciales y manifiesto de carga
        run: |
          npm run check:iam -- config/iam-bedrock-policy.json
          npm run scan:secrets
          node --import tsx scripts/build-load-manifest.ts --check

      # C-1: en producción, sin AUTH_JWT_SECRET la autenticación sería
      # decorativa. Se comprueba que el servicio se NIEGA a emitir tokens en
      # vez de arrancar con un secreto por defecto.
      - name: El perímetro exige secreto en producción
        env:
          NODE_ENV: production
        run: |
          node --import tsx -e '
            const { issueToken } = await import("./src/services/auth.js");
            try {
              await issueToken("chat");
              console.error("FALLO: se emitió un token sin AUTH_JWT_SECRET en producción");
              process.exit(1);
            } catch (error) {
              console.log("Correcto, rechazado:", error.message);
            }
          '

  # Verifica que la imagen se construye con sus dependencias NATIVAS, que es
  # donde estaba el fallo silencioso de A-3: LibreOffice ausente dejó 206
  # documentos sin indexar durante todo el proyecto.
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # El Dockerfile se construye desde la raíz (`backend` es el contexto); el valor global apunta a
    # `backend/` y haría buscar `backend/backend`.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construir la imagen
        run: docker build -t geobot-backend:ci backend
      # Dependencias NATIVAS y artefactos del bloque 2: argon2id (panel), tokenizador fijado y SDK de
      # Bedrock deben cargar dentro de la imagen; nada de tsx ni de proveedores heredados en producción.
      - name: Comprobar argon2, tokenizador y migraciones de chat/admin en la imagen
        run: |
          docker run --rm --entrypoint node geobot-backend:ci -e "
            (async () => {
              const a = await import('argon2');
              const h = await a.hash('contraseña-de-prueba', { type: a.argon2id, memoryCost: 65536, timeCost: 3, parallelism: 1 });
              if (!h.startsWith('\$argon2id\$v=19\$m=65536,p=1,t=3\$')) throw new Error('argon2id sin los parámetros documentados');
              const t = await import('/app/dist/chat/outputTokenizer.js');
              if (!t.tokenizerArtifactMatchesPin()) throw new Error('la huella del tokenizador no coincide');
              await import('@aws-sdk/client-bedrock-runtime');
              console.log('argon2id, tokenizador fijado y SDK de Bedrock cargan en la imagen');
            })().catch(e => { console.error(e.message); process.exit(1); });
          "
          docker run --rm --entrypoint sh geobot-backend:ci -c 'ls /app/migrations/chat/*.sql >/dev/null && test -f /app/dist/chat/migrateCli.js'
      - name: Comprobar que las herramientas externas existen en la imagen
        run: |
          docker run --rm --entrypoint sh geobot-backend:ci -c '
            set -e
            for cmd in tesseract soffice pdftoppm pdfinfo; do
              command -v "$cmd" >/dev/null || { echo "FALTA $cmd en la imagen"; exit 1; }
            done
            tesseract --list-langs | grep -q spa || { echo "FALTA el idioma spa"; exit 1; }
            echo "tesseract, soffice, pdftoppm y pdfinfo presentes; idioma spa disponible."
          '

  # Scraper (Python, proceso offline): adquisición, informe de corrida y
  # normalización de GMAS2, probados con fixtures HTML reales (research R18).
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web_scraper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web_scraper/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas del scraper
        run: python -m unittest discover -s tests

  # Base de conocimiento contra PostgreSQL y Qdrant reales: atomicidad del alias,
  # derogados, retención, permisos de roles (RF-C3-IV-01..12, RNF-C3-IV-01..03).
  kb-integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geobot_admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: geobot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geobot_admin -d geobot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.2-unprivileged
        ports: ["6333:6333"]
    env:
      KB_TEST_ADMIN_URL: postgres://geobot_admin:ci-admin@localhost:5432/geobot_test
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Herramientas de OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa poppler-utils
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas de integración de la base de conocimiento
        run: npm run test:kb-integracion

  # Chat y panel del bloque 2 contra PostgreSQL y Qdrant reales, con los modelos locales de embeddings
  # y reranker REALES y Bedrock simulado (`adapter=double`): no toca AWS y NO cuenta como aceptación.
  di-integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geobot_admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: geobot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geobot_admin -d geobot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.2-unprivileged
        ports: ["6333:6333"]
    env:
      KB_TEST_ADMIN_URL: postgres://geobot_admin:ci-admin@localhost:5432/geobot_test
      QDRANT_URL: http://localhost:6333
      RETRIEVAL_CACHE_DIR: ${{ github.workspace }}/backend/.cache/retrieval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Modelos locales (caché)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/.cache/retrieval/models
          key: modelos-retrieval-v1
      - name: Herramientas de OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa poppler-utils
      - name: Instalar dependencias
        run: npm ci
      - name: Integración del bloque 2 (roles, panel, perímetro, privacidad, consumo, recuperación)
        run: npm run test:di-integration

      # SPEC004: valoración (B09), contactos (B10), prerrequisitos y privacidad de la interfaz contra
      # PostgreSQL real y proveedor doble (`controlled`); no acredita la aceptación con Bedrock real.
      - name: Integración de la interfaz (valoración, contactos, privacidad)
        run: npm run test:ui-integration

  # SPEC005: integración C3–C4 contra PostgreSQL y Qdrant reales, proveedor Bedrock DOBLE (`controlled`) y
  # nginx real en Docker. Cubre origen/preflight, plazo desde la recepción, escritura acotada, episodios de
  # registro, privacidad, identidad de instancia (IMDS simulado), caché, capacidad y el generador del informe
  # de 31 casos. NO es aceptación: AWS, portal, Geoportal y dispositivos reales siguen siendo T074–T081.
  in-integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geobot_admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: geobot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geobot_admin -d geobot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.2-unprivileged
        ports: ["6333:6333"]
    env:
      KB_TEST_ADMIN_URL: postgres://geobot_admin:ci-admin@localhost:5432/geobot_test
      QDRANT_URL: http://localhost:6333
      RETRIEVAL_CACHE_DIR: ${{ github.workspace }}/backend/.cache/retrieval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Imagen de nginx de producción
        run: docker pull nginxinc/nginx-unprivileged:1.27-alpine
      # Un export del frontend es necesario para verificar la CSP de producción servida por nginx.
      - name: Export del frontend para la CSP
        working-directory: frontend
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_AGENT_API_URL: /api/chat
        run: |
          npm ci
          npm run build:widget
          npm run build
      - name: Integración SPEC005 (recepción, plazo, registro, privacidad, identidad, caché, capacidad, informe)
        run: npm run test:in-integration

  # Frontend: tipos, máquina de consentimiento, build estático y auditoría de dependencias.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Pruebas heredadas (consentimiento, flujo y enlaces seguros)
        run: npm test
      # SPEC004: reducer, cliente de 45 s, renderer Markdown, valoración y flujo de componentes.
      - name: Pruebas de interfaz (Vitest)
        run: npm run test:ui
      # El launcher debe pesar ≤10 000 bytes sin comprimir: el script falla si lo excede (RNF-C4-UI-01).
      - name: Construir el launcher
        run: npm run build:widget
      - name: Build estático
        env:
          NEXT_OUTPUT: export
        run: npm run build
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
      # E2E y axe sobre el export real de /chat y un host fixture (variante de prueba con CSP propia;
      # nunca amplía la de producción). En cada push solo corren Chromium de escritorio y Chromium móvil
      # emulado (200 pruebas): con los cinco navegadores eran ~500 y el job superaba el límite de
      # tiempo. La matriz completa (Firefox, WebKit y iPhone emulado) corre en e2e-navegadores.yml.
      # Estos navegadores NO equivalen a Chrome Android ni Safari iOS reales (T079).
      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium
      - name: Build de pruebas E2E
        run: npm run build:e2e
      - name: E2E y accesibilidad (axe)
        run: npm run test:ui:e2e:ci
      - name: Construir la imagen del frontend
        working-directory: .
        run: docker build -t geobot-frontend:ci frontend


  # SPEC007: panel de administración contra PostgreSQL y Qdrant reales (cuentas, documentos, enlaces,
  # contactos, avisos, interacciones, mejoras y tableros), con modelos locales reales y SIN AWS ni
  # producción. Los resultados son «controlados»: no acreditan rendimiento C6 ni revisión manual.
  admin-integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geobot_admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: geobot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geobot_admin -d geobot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.2-unprivileged
        ports: ["6333:6333"]
    env:
      KB_TEST_ADMIN_URL: postgres://geobot_admin:ci-admin@localhost:5432/geobot_test
      QDRANT_URL: http://localhost:6333
      RETRIEVAL_CACHE_DIR: ${{ github.workspace }}/backend/.cache/retrieval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Modelos locales (caché)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/.cache/retrieval/models
          key: modelos-retrieval-v1
      - name: Herramientas de OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa poppler-utils
      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci
      - name: Auditoría de dependencias (sin vulnerabilidades altas)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Pruebas unitarias del panel (validadores)
        working-directory: backend
        run: npm run test:admin
      - name: Integración del panel (US1–US7)
        working-directory: backend
        run: npm run test:admin-integration
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: Pruebas de interfaz del panel (Vitest)
        working-directory: frontend
        run: npm run test:admin
      - name: Export del panel y navegador
        working-directory: frontend
        run: |
          npm run build:admin
          npx playwright install --with-deps chromium
      - name: E2E del panel (API real y base aislada)
        working-directory: frontend
        run: npm run test:admin:e2e -- --project=chromium
      - name: Accesibilidad del panel (axe, A y AA)
        working-directory: frontend
        run: npm run test:admin:a11y -- --project=chromium

  # SPEC006: fixtures, DB/Qdrant temporales y proveedor doble. No AWS ni firmas en CI.
  validacion-aislada:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construir imagen de pruebas nativas
        run: docker compose -p spec006-validation -f docker-compose.validation.yml build validation
      - name: Tipos y contratos offline de validación
        run: docker compose -p spec006-validation -f docker-compose.validation.yml run --rm validation sh -c 'npm run typecheck && npm run test:validation'
      - name: Integración VA con PostgreSQL, Qdrant y proveedor doble
        run: docker compose -p spec006-validation -f docker-compose.validation.yml run --rm validation npm run test:validation-integration
      - name: Retirar servicios temporales
        if: always()
        run: docker compose -p spec006-validation -f docker-compose.validation.yml down
